volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: julverikk/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    restart: always
    depends_on:
      - db

  frontend:
    image: julverikk/kittygram_frontend:latest
    env_file: .env
    command: sh -c "mkdir -p /frontend_static && cp -r /app/build/. /frontend_static/"
    volumes:
      - static:/frontend_static

  gateway:
    image: julverikk/kittygram_gateway:latest
    volumes:
      - static:/static
      - media:/media
    ports:
      - 9000:80
    restart: always